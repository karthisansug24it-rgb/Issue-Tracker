server:
  port: 8080

spring:
  application:
    name: devtrack-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

# Default profile uses persistent H2 in PostgreSQL compatibility mode
# Data is safely preserved in ./data/devtrack.mv.db
---
spring:
  config:
    activate:
      on-profile: default
  datasource:
    url: jdbc:h2:file:./data/devtrack;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

# Production PostgreSQL Profile
# Activate by setting SPRING_PROFILES_ACTIVE=postgres
---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:devtrack}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect

# App-specific security configuration
devtrack:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 hours
