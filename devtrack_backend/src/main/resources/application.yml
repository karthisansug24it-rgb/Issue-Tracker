server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: devtrack-backend
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  sql:
    init:
      # schema.sql is reference DDL for DBeaver; Hibernate manages the tables
      mode: never
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

# App-specific configuration
devtrack:
  jwt:
    # Required for shared/production setups (min 32 characters). If empty, a random key
    # is generated at startup and users must sign in again after each restart.
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  cors:
    # Browser origins allowed to call the API (Flutter web). Desktop apps are unaffected.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  seed:
    # Load demo departments, teams, projects, issues and demo accounts on an empty database
    demo-data: ${SEED_DEMO_DATA:true}
  bootstrap:
    # First Super Admin, created only when no active Super Admin exists.
    # If no password is given, a random one is generated and printed once in the log.
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:superadmin@devtrack.com}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}

# Default profile uses persistent H2 in PostgreSQL compatibility mode
# Data is safely preserved in ./data/devtrack.mv.db
---
spring:
  config:
    activate:
      on-profile: default
  datasource:
    url: jdbc:h2:file:./data/devtrack;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      # Off unless explicitly requested; only ever reachable from localhost
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

# Production PostgreSQL Profile
# Activate by setting SPRING_PROFILES_ACTIVE=postgres in .env
---
spring:
  config:
    activate:
      on-profile: "postgres | issuetracker"
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:issuetracker}}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
